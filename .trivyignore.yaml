# Exceções aceitas na política do Trivy (security.yml).
# Cada exceção precisa de um motivo e de uma data de expiração: depois dela,
# a vulnerabilidade volta a bloquear o deploy e precisa ser revista.
#
# Exemplo:
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: Módulo afetado não é usado pela aplicação (motivo).
#     expired_at: 2026-12-31
vulnerabilities:
  # libxslt na imagem nginx:1.30-alpine. A correção (1.1.43-r4) já existe no Alpine, mas a
  # imagem oficial do nginx ainda não foi reconstruída com ela. O libxslt só é usado pelo
  # módulo ngx_http_xslt_filter_module, que o nosso nginx não carrega (sem load_module).
  # Revisar quando o Dependabot trouxer um digest novo do nginx:1.30-alpine.
  - id: CVE-2026-125350
    statement: libxslt só é usado pelo módulo XSLT do nginx, que não é carregado.
    expired_at: 2026-12-18
  - id: CVE-2026-87636
    statement: libxslt só é usado pelo módulo XSLT do nginx, que não é carregado.
    expired_at: 2026-12-18
  - id: CVE-2026-9947
    statement: libxslt só é usado pelo módulo XSLT do nginx, que não é carregado.
    expired_at: 2026-12-18
