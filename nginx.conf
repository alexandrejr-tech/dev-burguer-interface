server {
    # Porta em que o Nginx escuta dentro do container (o Traefik encaminha para cá).
    listen 80;
    server_name _;

    # Não mostra a versão do Nginx nos cabeçalhos e páginas de erro.
    server_tokens off;

    # Pasta com os arquivos gerados pelo "yarn build".
    root /usr/share/nginx/html;
    index index.html;

    # Compacta respostas de texto para carregar mais rápido.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos em /assets têm um hash no nome que muda a cada build,
    # então podem ficar em cache no navegador por 1 ano.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Qualquer outro caminho (/cardapio, /admin/pedidos...) devolve o index.html,
    # e o React Router decide qual página mostrar. Sem isso, recarregar a página dá 404.
    # O index.html não fica em cache, para o navegador sempre pegar a versão nova.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
